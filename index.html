<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una flor para ti 🌻</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>

    <main class="scene">
        <div class="intro" id="intro">
            <p class="small">Tengo algo que quiero decirte...</p>
            <h1>Para ti, con mucho cariño 💛</h1>
            <button id="startBtn">Toca aquí 🌻</button>
        </div>

        <div class="garden" id="garden">
            <div class="moon"></div>
            <div class="flower">
                <div class="stem"></div>
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
                <div class="flower-head">
                    <span class="petal p1"></span><span class="petal p2"></span>
                    <span class="petal p3"></span><span class="petal p4"></span>
                    <span class="petal p5"></span><span class="petal p6"></span>
                    <span class="petal p7"></span><span class="petal p8"></span>
                    <span class="center"></span>
                </div>
            </div>
        </div>

        <section class="message" id="message">
            <div class="card">
                <div class="tiny-flower">🌻</div>
                <h2>Para una persona muy especial</h2>
                <p id="typedText"></p>
                <div class="heart">♥</div>
                <p class="signature">Con mucho cariño, siempre. 💛</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
